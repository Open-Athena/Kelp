[project]
name = "kelp"
version = "0.1.0"
description = "Program repair via tree diffusion."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marin-core>=0.2.46.dev202607131620",
    "marin-levanter>=0.2.46.dev202607131620",
    "egglog",
]

[project.optional-dependencies]
tpu = ["marin-core[tpu]; sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kelp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
